name: Build and publish Docker image

# Builds the Dockerfile at repo root and pushes it to Docker Hub
# (quffy4/cloud-plus) on every push to main, plus on-demand via the
# Actions tab ("Run workflow"). Every run publishes :latest and a
# short-SHA tag; the Actions tab's "Run workflow" form also has an
# optional "tag" field for publishing an extra custom tag (e.g.
# v1.0.0) alongside those two.
#
# Requires two repo secrets set up under
# Settings -> Secrets and variables -> Actions:
#   DOCKERHUB_USERNAME = quffy4
#   DOCKERHUB_TOKEN    = a Docker Hub access token (not your password)
# No local Docker or manual `docker push` needed on anyone's machine
# once those secrets exist — the image just shows up at
# docker.io/quffy4/cloud-plus after each run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish alongside latest/sha (optional)"
        required: false
        type: string

env:
  IMAGE_NAME: quffy4/cloud-plus

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

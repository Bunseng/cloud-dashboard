# Serves the built SPA and falls back every unknown path to
# index.html — required for React Router's client-side routes
# (e.g. /storage, /runapp/1, /groups/grp-devops) to work on a hard
# refresh or direct link instead of 404ing at the web server level.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames (Vite's build output) are safe to cache
    # hard; index.html itself must always be revalidated so deploys
    # take effect immediately instead of being served stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
